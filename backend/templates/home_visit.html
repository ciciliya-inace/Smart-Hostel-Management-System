<!DOCTYPE html>
<html>

<head>

    <title>Home Visit - Smart Hostel</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <h1>Home / Guardian Visit Request</h1>

    <form method="POST" action="/home-visit">

        <label>Student ID</label>

        <br>

        <input
            type="text"
            name="student_id"
            placeholder="Enter Student ID"
            required
        >

        <br><br>


        <label>Visit Date</label>

        <br>

        <input
            type="date"
            name="visit_date"
            required
        >

        <br><br>


        <label>Guardian Name</label>

        <br>

        <input
            type="text"
            name="guardian_name"
            placeholder="Enter Guardian Name"
            required
        >

        <br><br>


        <label>Guardian Phone Number</label>

        <br>

        <input
            type="tel"
            name="guardian_phone"
            placeholder="Enter Guardian Phone Number"
            required
        >

        <br><br>


        <label>Place / Address</label>

        <br>

        <textarea
            name="address"
            placeholder="Enter Home Address"
            rows="4"
            required
        ></textarea>

        <br><br>


        <label>Reason</label>

        <br>

        <textarea
            name="reason"
            placeholder="Enter reason for home visit"
            rows="4"
            required
        ></textarea>

        <br><br>


        <button type="submit">
            Submit Home Visit Request
        </button>

    </form>

</body>

</html>
